
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Vault | Food Tracking</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="images/website_logo.png" alt="Logo" />
        <span>WorkAccyr Recipes</span>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Recipes</a></li>
          <li><a href="planning.html">Meal Planner</a></li>
          <li><a href="tracking.html" class="active">Food Log</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="profile.html" id="nav-profile-link">Sign In</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Daily Meal & Recipe Log</h1>
        <p>Track what you've cooked and eaten from your saved recipes.</p>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 0.9rem; opacity: 0.9;">Total Logged Calories</div>
        <div id="total-calories" style="font-size: 2rem; font-weight: 700;">0 kcal</div>
      </div>
    </section>

    <section class="card" style="margin-bottom: 2rem;">
      <h2>Log a Meal</h2>
      <form id="tracking-form" class="grid-3" style="align-items: end;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="track-recipe">Recipe Eaten</label>
          <select id="track-recipe" required></select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="track-servings">Servings</label>
          <input type="number" id="track-servings" value="1" min="0.5" step="0.5" required />
        </div>
        <button type="submit" class="btn btn-primary">Log Meal</button>
      </form>
    </section>

    <section class="card">
      <h2>Logged History</h2>
      <div id="tracking-list" style="margin-top: 1rem;"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 WorkAccyr Recipe & Meal Tracker. Local Client-Side Storage.</p>
  </footer>

  <script src="script/main.js"></script>
</body>
</html>
